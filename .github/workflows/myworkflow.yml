
name: to-do app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    name: Test Application
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Check backend syntax
        run: node --check backend/server.js

      - name: Build frontend image
        run: docker build -t todo-frontend:test frontend

      - name: Build backend image
        run: docker build -t todo-backend:test backend
         
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
      
      - name: Scan frontend image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 todo-frontend:test

      - name: Scan backend image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 todo-backend:test
      

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker images
        run: |
          docker tag todo-backend:test zaki4u/todo-backend:${{ github.sha }}
          docker tag todo-frontend:test zaki4u/todo-frontend:${{ github.sha }}

      - name: Push images to Docker Hub
        run: |
          docker push zaki4u/todo-backend:${{ github.sha }}
          docker push zaki4u/todo-frontend:${{ github.sha }}

      - name: Update Kubernetes image tags
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: zaki4u/todo-backend:.*|image: zaki4u/todo-backend:${GITHUB_SHA}|" todo-k8s/backend/backend-deployment.yml
          sed -i "s|image: zaki4u/todo-frontend:.*|image: zaki4u/todo-frontend:${GITHUB_SHA}|" todo-k8s/frontend/frontend-deployment.yml

      - name: Commit and push Kubernetes manifests
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo-k8s/backend/backend-deployment.yml todo-k8s/frontend/frontend-deployment.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update Kubernetes images to ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

