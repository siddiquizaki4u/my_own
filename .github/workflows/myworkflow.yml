
name: to-do app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Application
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Check backend syntax
        run: node --check backend/server.js

      - name: Build frontend image
        run: docker build -t todo-frontend:test frontend

      - name: Build backend image
        run: docker build -t todo-backend:test backend
         
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
      
      - name: Scan frontend image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 todo-frontend:test

      - name: Scan backend image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 todo-backend:test

