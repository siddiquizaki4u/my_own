apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: my-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      containers:
        - name: frontend
          image: zaki4u/todo-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
