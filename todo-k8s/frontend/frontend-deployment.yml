apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: my-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      containers:
        - name: frontend
          image: zaki4u/todo-frontend:233e09f8073e76c9d653f021b721b481589ad56c
          imagePullPolicy: Always
          ports:
            - containerPort: 80
