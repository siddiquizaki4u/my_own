apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: my-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      containers:
        - name: frontend
          image: zaki4u/todo-frontend:ded1b8b870388fe70c452716f44f686e588440ad
          imagePullPolicy: Always
          ports:
            - containerPort: 80
